<!-- Pass Royale | Versão 1.6 | Prévia independente para Google Chrome.
     O original usa React 19 / Vinext / Cloudflare Workers / D1.
     Versão 2.8 otimizada, mantendo o frontend e os recursos do projeto.
     O contador requer o servidor local incluso no ZIP ou o backend da hospedagem; a enquete original está inativa.
     A fonte editável permanece intacta no pacote completo. -->

<script>
"use strict";
/* React e frontend da publicação original, empacotados para um único HTML sem dependências externas. */
/* Não fingir dados do YouTube ou votos reais: respostas honestas na prévia offline. */
const __pass_fetch_original = window.fetch.bind(window);
window.fetch = function(input, init) {
  const url = typeof input === 'string' ? input : (input && input.url) || '';
  if (url === '/api/channel') {
    return __pass_fetch_original(input, init);
  }
  if (url === '/api/poll') {
    return Promise.resolve(new Response(JSON.stringify({error:'Enquete indisponível na prévia offline. A votação real exige o site hospedado.'}),
      {status:503, headers: {'Content-Type':'application/json'}}));
  }
  return __pass_fetch_original(input, init);

<script id="pr21-script">
(()=>{

  const offers=[{"name":"Punhado de Gemas","amount":"80","image":"assets/images/pr-010.webp"},{"name":"Bolsa de Gemas","amount":"500","image":"assets/images/pr-011.webp"},{"name":"Balde de Gemas","amount":"1 200","image":"assets/images/pr-012.webp"},{"name":"Barril de Gemas","amount":"2 500","image":"assets/images/pr-013.webp"},{"name":"Carrinho de Gemas","amount":"6 500","image":"assets/images/pr-014.webp"},{"name":"Montanha de Gemas","amount":"14 000","image":"assets/images/pr-015.webp"}];
  const channel='https://www.youtube.com/@PassRoyale2003?sub_confirmation=1';
  const $=(selector,root=document)=>root.querySelector(selector);

  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let index=0,slideTimer=null,observer=null;
  const safeNum=i=>Math.min(Math.max(0,Number(i)||0),offers.length-1);
  const sparkles=()=>Array.from({length:19},(_,i)=>{

  }).join('');
  function tunePass(){
    const card=$('#torneios .pr19-pass-card');

    if(heroName)heroName.remove();
    card.classList.add('pr21-pass-card');
  }
  function renderCard(){
    const parent=$('#torneios .tournament-prizes');
    if(!parent)return null;
    const old=$('#torneios .pr21-gem-card');
    if(old)return old;
    const target=[...parent.querySelectorAll('.tournament-prize')].find(el=>/Gemas/i.test(el.querySelector('h4')?.textContent||''));
    if(!target)return null;
    const card=document.createElement('article');
    card.className='tournament-prize prize-emerald pr21-gem-card';
    const dots=offers.map((it,i)=>`<button type="button" class="pr21-gem-dot" data-index="${i}" aria-label="Mostrar ${it.name}" aria-current="${i===index}"></button>`).join('');
    card.innerHTML=`<div class="tournament-prize-icon" aria-hidden="true">◆</div>
      <div class="tournament-prize-text"><small>RECOMPENSAS ÉPICAS</small><h4>Gemas</h4></div>

    target.replaceWith(card);
    card.querySelector('.pr21-gem-hit').addEventListener('click',openGallery);

    $$('.pr21-gem-dot',card).forEach((b,i)=>b.setAttribute('aria-current',String(i===index)));
  }
  function makeReward(item,i){
    return `<article class="pr21-reward">
      <h3>${item.name}</h3>

    </div>`;
    document.body.appendChild(gallery);
    gallery.querySelector('.pr21-close').addEventListener('click',()=>gallery.close());

      <div class="pr21-goal"><strong>100</strong><span>INSCRITOS PARA INICIAR TORNEIOS E SORTEIOS</span></div>
      <a class="pr21-subscribe" href="${channel}" target="_blank" rel="noopener noreferrer">▶ INSCREVA-SE NO CANAL</a>
      <button type="button" class="pr21-back">← Voltar às gemas</button>

    </div>`;
    document.body.appendChild(gate);

  }
  function openGallery(){createDialogs();const gal=$('#pr21-gems-dialog');if(!gal.open)gal.showModal();}
  function showGate(i){
    createDialogs();

    const gate=$('#pr21-gems-gate');if(!gate.open)gate.showModal();
  }
  function apply(){
    tunePass();const card=renderCard();return !!card;
  }
  function start(){
    document.title='Pass Royale — Versão 2.3 · Evoluções Premium';
    createDialogs();
    apply();
    const root=$('#torneios .tournament-prizes');
    if(root){
      let scheduled=false;
      observer=new MutationObserver(()=>{
        if(scheduled)return;scheduled=true;
        queueMicrotask(()=>{scheduled=false;apply();});
      });
      observer.observe(root,{childList:true});
    }
    // Also cover delayed renderers that replace the entire treasury grid.
    setInterval(apply,1800);
    if(!reduced)slideTimer=setInterval(()=>{index=(index+1)%offers.length;updateSlide();},3000);
    window.__PassRoyale21={version:'2.1',gems:offers.length,ready:true};
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();

</script>

 function sparkles(){return Array.from({length:20},(_,i)=>{let x=(9+i*37)%91,y=(8+i*29)%83,n=3+i%4;return `<i class="pr24-hero-particle" aria-hidden="true" style="--x:${x}%;--y:${y}%;--size:${n}px;--dur:${3.2+(i%5)*.58}s;--delay:-${(i*.26).toFixed(2)}s"></i>`}).join('')}
 function renderCard(){
   const host=$('#torneios .tournament-prizes');if(!host)return null;
   const previous=$('.pr24-hero-card',host);if(previous)return previous;
   const old=$$('.tournament-prize',host).find(e=>/^Heróis$/i.test((e.querySelector('h4')?.textContent||'').trim()));
   if(!old)return null;
   const el=document.createElement('article');el.className='tournament-prize prize-blue pr24-hero-card';
   const dots=Array.from({length:Math.ceil(total/4)},(_,i)=>`<button type="button" class="pr24-hero-dot" data-hero-slide="${i*4}" aria-label="Mostrar grupo ${i+1} de heroluções" aria-current="${i===0}"></button>`).join('');
   el.innerHTML=`<div class="tournament-prize-icon" aria-hidden="true">♛</div><div class="tournament-prize-text"><small>RECOMPENSAS ÉPICAS</small><h4>Heróis</h4></div><span class="pr24-hero-cta">✦ ${total} HERÓIS DISPONÍVEIS</span><div class="pr24-hero-art" aria-hidden="true"><div class="pr24-hero-art-wrap"><img class="pr24-hero-image" src="${heroes[active].image}" alt="" width="180" height="180" decoding="async"/></div></div>${sparkles()}<button type="button" class="pr24-hero-hit" aria-label="Ver as ${total} versões heroluídas"></button><div class="pr24-hero-dots" role="group" aria-label="Selecionar herolução do carrossel">${dots}</div>`;
   old.replaceWith(el);
   $('.pr24-hero-hit',el).addEventListener('click',openGallery);
   $$('.pr24-hero-dot',el).forEach(dot=>dot.addEventListener('click',e=>{e.stopPropagation();setSlide(Number(dot.dataset.heroSlide),true)}));
   return el;
 }
 function setSlide(n,instant){
   active=((n%total)+total)%total;
   const host=$('.pr24-hero-card');if(!host)return;
   const img=$('.pr24-hero-image',host);const slide=heroes[active];
   const update=()=>{img.src=slide.image;img.alt=slide.name;img.classList.remove('is-changing')};
   if(instant||reduced)update();else{img.classList.add('is-changing');setTimeout(update,170)}
   $$('.pr24-hero-dot',host).forEach((d,i)=>d.setAttribute('aria-current',String(i===Math.floor(active/4))));
 }
 function makeReward(e,i){return `<article class="pr24-reward"><div class="pr24-figure"><img src="${e.image}" alt="${e.name}" loading="lazy" decoding="async"></div><button class="pr24-gratis" type="button" data-hero-claim="${i}" aria-label="Consultar ${e.name}, grátis">GRÁTIS</button><button class="pr24-claim" type="button" data-hero-claim="${i}" aria-label="Consultar participação para ${e.name}">RESGATAR</button></article>`}
 function createDialogs(){
   if($('#pr24-hero-dialog'))return;
   const dialog=document.createElement('dialog');dialog.id='pr24-hero-dialog';dialog.className='pr24-modal';dialog.setAttribute('aria-labelledby','pr24-hero-title');
   dialog.innerHTML=`<div class="pr24-modal-shell"><header class="pr24-modal-head"><span class="pr24-tag">♛ RECOMPENSAS ÉPICAS ♛</span><h2 id="pr24-hero-title">Versões Heroicas</h2><button type="button" class="pr24-close" aria-label="Fechar heroluções">×</button></header><div class="pr24-grid">${heroes.map(makeReward).join('')}</div><p class="pr24-modal-foot">${total} heroluções únicas em destaque. Recompensas são possibilidades de futuros torneios e sorteios; inscrições não garantem prêmios. Regulamento divulgado antes de cada evento. Projeto independente de fã, não afiliado à Supercell.</p></div>`;
   document.body.appendChild(dialog);
   $('.pr24-close',dialog).addEventListener('click',()=>dialog.close());
   dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
   dialog.addEventListener('click',e=>{const b=e.target.closest('[data-hero-claim]');if(b)openGate(Number(b.dataset.heroClaim))});
   const gate=document.createElement('dialog');gate.id='pr24-hero-gate';gate.className='pr24-gate';gate.setAttribute('aria-labelledby','pr24-gate-title');
   gate.innerHTML=`<div class="pr24-gate-panel"><span aria-hidden="true" style="font-size:38px;filter:drop-shadow(0 0 13px #ebc1ff)">♛</span><small>MISSÃO DA ARENA</small><h3 id="pr24-gate-title">Primeiro, vamos alcançar nossa meta!</h3><p id="pr24-gate-text"></p><div class="pr24-goal"><strong>100</strong><span>INSCRITOS PARA COMEÇAR OS TORNEIOS</span></div><a class="pr24-subscribe" href="${channel}" target="_blank" rel="noopener noreferrer">▶ INSCREVA-SE NO CANAL</a><button type="button" class="pr24-back">← Voltar às heroluções</button><span class="pr24-disclaimer">A palavra “GRÁTIS” é ilustrativa. A inscrição não libera recompensas nem garante premiação. As condições e regras serão anunciadas antes dos eventos.</span></div>`;
   document.body.appendChild(gate);
   $('.pr24-back',gate).addEventListener('click',()=>gate.close());
   gate.addEventListener('click',e=>{if(e.target===gate)gate.close()});
 }
 function openGallery(){createDialogs();const d=$('#pr24-hero-dialog');if(!d.open)d.showModal()}
 function openGate(i){createDialogs();const e=heroes[i]||heroes[0];$('#pr24-gate-text').textContent=`${e.name} está entre as possíveis recompensas de futuros torneios da comunidade. Primeiro precisamos chegar à meta de 100 inscritos. Depois divulgaremos as regras, os critérios, as datas e a forma de participação. A premiação dependerá de competição ou evento anunciado oficialmente pelo canal.`;const d=$('#pr24-hero-gate');if(!d.open)d.showModal()}
 function init(){
   document.title='Pass Royale — Versão 2.4 · Heróis Premium';
   createDialogs();renderCard();
   const parent=$('#torneios .tournament-prizes');
   if(parent){let busy=false;new MutationObserver(()=>{if(busy)return;busy=true;queueMicrotask(()=>{busy=false;renderCard()})}).observe(parent,{childList:true})}
   let retries=0;const timer=setInterval(()=>{if(renderCard()||++retries>100)clearInterval(timer)},140);
   if(!reduced)setInterval(()=>setSlide(active+1,false),2900);
   window.__PassRoyale24={version:'2.4',heroes:total,unique:unique.size,optimized:true,ready:true};
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();

<script id="pr25-script">
(()=>{
  'use strict';
  /* PASS ROYALE 2.5 · Tesouraria de temporadas · dados de imagens substituídos no build */
  const passes=[
    {id:'novembro-2026',name:'Gigante Evoluído',month:'NOVEMBRO 2026',short:'NOVEMBRO',season:'ATUAL',card:'assets/images/pr-071.webp',reward:'assets/images/pr-072.webp',available:true},
    {id:'outubro-2026',name:'Mago Elétrico Heroico',month:'OUTUBRO 2026',short:'OUTUBRO',season:'ENCERRADA',card:'assets/images/pr-073.webp',reward:'assets/images/pr-074.webp',available:false}
  ];
  const channel='https://www.youtube.com/@PassRoyale2003?sub_confirmation=1';
  const $=(s,r=document)=>r.querySelector(s);
  const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
  const reduced=!!window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches;
  let active=0;
  function sparkles(){return Array.from({length:19},(_,i)=>`<i class="pr25-spark" aria-hidden="true" style="--x:${(10+i*37)%90}%;--y:${(15+i*23)%80}%;--delay:-${i*.22}s;--duration:${3.2+i%5*.42}s"></i>`).join('');}
  function renderCard(){
    const host=$('#torneios .tournament-prizes'); if(!host)return null;
    const existing=$('.pr25-pass-card',host);if(existing)return existing;
    const previous=$$('.tournament-prize',host).find(el=>/^Pass Royale$/i.test((el.querySelector('h4')?.textContent||'').trim()));
    if(!previous)return null;
    const card=document.createElement('article');
    card.className='tournament-prize prize-gold pr25-pass-card';
    card.innerHTML=`<div class="tournament-prize-icon" aria-hidden="true">♛</div>
      <div class="tournament-prize-text"><small>A GRANDE RECOMPENSA</small><h4>Pass Royale</h4></div>
      <span class="pr25-pass-cta">✦ 2 TEMPORADAS EM DESTAQUE</span>
      <div class="pr25-pass-art" aria-hidden="true"><div class="pr25-pass-art-wrap">
        <img class="pr25-pass-image" src="${passes[active].card}" alt="" decoding="async" width="210" height="160" />
      </div></div>${sparkles()}
      <button type="button" class="pr25-pass-hit" aria-label="Ver Pass Royale de outubro e novembro de 2026"></button>
      <div class="pr25-pass-dots" role="group" aria-label="Navegar pelos dois Passes Royale">
        ${passes.map((p,i)=>`<button type="button" class="pr25-pass-dot" data-pr25-slide="${i}" aria-label="Mostrar ${p.month.toLowerCase()}" aria-current="${i===0}"></button>`).join('')}
      </div>`;
    previous.replaceWith(card);
    $('.pr25-pass-hit',card).addEventListener('click',openGallery);
    $$('.pr25-pass-dot',card).forEach(dot=>dot.addEventListener('click',event=>{event.stopPropagation();showSlide(Number(dot.dataset.pr25Slide),true)}));
    return card;
  }
  function showSlide(i,instant=false){
    active=((i%passes.length)+passes.length)%passes.length;
    const card=$('.pr25-pass-card');if(!card)return;
    const image=$('.pr25-pass-image',card);
    if(!image)return;
    const update=()=>{image.src=passes[active].card;image.alt=passes[active].month;image.classList.remove('is-changing')};
    if(instant||reduced)update();else{image.classList.add('is-changing');setTimeout(update,180)}
    $$('.pr25-pass-dot',card).forEach((dot,j)=>dot.setAttribute('aria-current',String(j===active)));
  }
  function offerMarkup(p,i){
    return `<article class="pr25-offer ${p.available?'pr25-offer--current':'pr25-offer--archived'}">
       <div class="pr25-offer-top"><span class="pr25-season">${p.month}</span>
         <span class="pr25-state ${p.available?'pr25-state--current':'pr25-state--archived'}">${p.available?'★ DESTAQUE ATUAL':'TEMPORADA ENCERRADA'}</span></div>
       <div class="pr25-offer-title"><h3>Pass Royale</h3><p>${p.name}</p></div>
       <div class="pr25-reward-figure"><img src="${p.reward}" alt="${p.name} e suas recompensas da temporada ${p.month}" loading="lazy" decoding="async" /></div>
       <div class="pr25-offer-controls">
         ${p.available?`<button type="button" class="pr25-free" data-pr25-claim="${i}">GRÁTIS</button><button type="button" class="pr25-claim" data-pr25-claim="${i}">RESGATAR</button>`:`<button type="button" class="pr25-free pr25-unavailable" disabled aria-label="Passe de outubro indisponível">INDISPONÍVEL</button><button type="button" class="pr25-claim pr25-unavailable" disabled>RESGATE ENCERRADO</button>`}
       </div>
       <p class="pr25-offer-note">${p.available?'Participe da comunidade e acompanhe nossa meta de inscritos. O resgate ainda depende das regras oficiais do sorteio.':'O Pass Royale de outubro de 2026 é exibido apenas para consulta ao histórico da Arena.'}</p>
     </article>`;
  }
  function buildDialogs(){
    if($('#pr25-pass-dialog'))return;
    const modal=document.createElement('dialog');modal.id='pr25-pass-dialog';modal.className='pr25-modal';modal.setAttribute('aria-labelledby','pr25-pass-title');
    modal.innerHTML=`<div class="pr25-modal-shell"><div class="pr25-modal-head">
      <span class="pr25-modal-tag">♛ A GRANDE RECOMPENSA ♛</span>
      <h2 id="pr25-pass-title">Pass Royale</h2>
      <p>Explore as recompensas das temporadas de outubro e novembro de 2026.</p>
      <button type="button" class="pr25-close" aria-label="Fechar Pass Royale">×</button></div>
      <div class="pr25-grid">${passes.map(offerMarkup).join('')}</div>
      <p class="pr25-modal-foot">Novembro está em destaque na comunidade Pass Royale. O botão “GRÁTIS” mostra uma possibilidade de participação futura, não uma entrega automática. A inscrição não garante prêmio; a data, a elegibilidade e o regulamento serão divulgados antes do sorteio. Projeto independente, não afiliado à Supercell.</p>
    </div>`;
    document.body.appendChild(modal);
    $('.pr25-close',modal).addEventListener('click',()=>modal.close());
    modal.addEventListener('click',e=>{if(e.target===modal)modal.close();});
    modal.addEventListener('click',e=>{const b=e.target.closest('[data-pr25-claim]');if(b)openGate(Number(b.dataset.pr25Claim));});
    const gate=document.createElement('dialog');gate.id='pr25-pass-gate';gate.className='pr25-gate';gate.setAttribute('aria-labelledby','pr25-gate-title');
    gate.innerHTML=`<div class="pr25-gate-panel"><span class="pr25-gate-icon" aria-hidden="true">♛</span>
       <small>MISSÃO DA ARENA · NOVEMBRO 2026</small>
       <h3 id="pr25-gate-title">Primeiro, vamos alcançar nossa meta!</h3>
       <p id="pr25-gate-text"></p>
       <div class="pr25-goal"><strong>100</strong><span>INSCRITOS PARA COMEÇAR OS TORNEIOS E SORTEIOS</span></div>
       <a href="${channel}" class="pr25-subscribe" target="_blank" rel="noopener noreferrer">▶ INSCREVA-SE NO CANAL</a>
       <button type="button" class="pr25-back">← Voltar aos passes</button>
       <span class="pr25-disclaimer">A inscrição não entrega automaticamente um Pass Royale e não garante premiação. A mecânica e as regras serão anunciadas no canal.</span></div>`;
    document.body.appendChild(gate);
    $('.pr25-back',gate).addEventListener('click',()=>gate.close());
    gate.addEventListener('click',e=>{if(e.target===gate)gate.close()});
  }
  function openGallery(){buildDialogs();const d=$('#pr25-pass-dialog');if(d&&!d.open)d.showModal();}
  function openGate(i){
    if(!passes[i]?.available)return;
    buildDialogs();
    $('#pr25-gate-text').textContent=`O Pass Royale de novembro de 2026, com o Gigante Evoluído, está em destaque entre as possíveis recompensas do canal. Primeiro precisamos alcançar a meta de 100 inscritos. Depois divulgaremos as regras do sorteio, os critérios e a forma de participação. Nenhum passe é entregue automaticamente.`;
    const gate=$('#pr25-pass-gate');if(!gate.open)gate.showModal();
  }
  function init(){
    document.title='Pass Royale — Versão 2.8 · Arena Lendária';
    buildDialogs();renderCard();
    const host=$('#torneios .tournament-prizes');
    if(host){let busy=false;new MutationObserver(()=>{if(busy)return;busy=true;queueMicrotask(()=>{busy=false;renderCard()})}).observe(host,{childList:true});}
    let n=0;const retry=setInterval(()=>{if(renderCard()||++n>130)clearInterval(retry)},140);
    if(!reduced)setInterval(()=>showSlide(active+1),3800);
    window.__PassRoyale25={version:'2.5',passes:passes.length,current:'novembro-2026',archived:'outubro-2026',optimized:true,ready:true};
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();

</script>

<script id="pr26-script">
/* Pass Royale v2.6: carousel built from the existing 4 treasury cards, without re-encoding images */
(function(){'use strict';
  const names=['Pass Royale','Gemas','Heróis','Evoluções'];
  const selectors=['.pr25-pass-hit','.pr21-gem-hit','.pr24-hero-hit','.pr22-evo-hit'];

    const cards=Array.from(document.querySelectorAll('#torneios .tournament-prizes > .tournament-prize'));
    const matching=names.map(name=>cards.find(card=>(card.querySelector('h4')?.textContent||'').trim()===name));
    return matching.every(Boolean)?matching:null;
  }
  function activateSource(idx){
    const original=originals[idx];

    const hit=original.querySelector(selectors[idx]);
    if(hit)hit.click();else original.click();

  function buildSlide(){
    if(!holder || !originals[active])return;

    clone.querySelectorAll('button,a,input,select,[tabindex]').forEach(item=>{item.setAttribute('tabindex','-1');item.setAttribute('aria-hidden','true')});

    button.addEventListener('click',()=>activateSource(active));

    holder.replaceChildren(button);
    holder.style.animation='none';void holder.offsetWidth;holder.style.animation='';
    const counter=q('#torneios .pr26-slide-counter');
    if(counter)counter.textContent=String(active+1).padStart(2,'0')+' / 04';
    document.querySelectorAll('#torneios .pr26-dot').forEach((dot,i)=>dot.setAttribute('aria-current',String(i===active)));

  function initialize(){
    if(ready)return true;
    const showcase=q('#torneios .pr26-showcase');
    const cards=locate();
    if(!showcase||!cards||!cards.every((card,i)=>card.querySelector(selectors[i])))return false;
    holder=q('.pr26-slide-host',showcase);if(!holder)return false;
    originals=cards;
    const dots=q('.pr26-dots',showcase);
    if(dots){names.forEach((name,i)=>{
      const dot=document.createElement('button');dot.type='button';dot.className='pr26-dot';dot.setAttribute('aria-label','Mostrar '+name);dot.setAttribute('aria-current',String(i===0));

    q('.pr26-next',showcase)?.addEventListener('click',()=>show(active+1,true));
    showcase.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(active+1,true)}else if(e.key==='ArrowLeft'){e.preventDefault();show(active-1,true)}});

    return true;
  }

<script id="pr27-script">

/* Pass Royale 2.7 — ambient particles. No timers, external images, canvas or third-party dependencies. */
(()=>{'use strict';
  function setup(){
    const scene=document.getElementById('torneios');
    if(!scene)return false;
    if(scene.querySelector('.pr27-embers'))return true;
    const holder=document.createElement('div');holder.className='pr27-embers';holder.setAttribute('aria-hidden','true');
    for(let i=0;i<31;i++){
      const spark=document.createElement('i');
      spark.className='pr27-ember'+(i%7===0?' pr27-ember-purple':'');
      const x=(i*37+11)%98,y=(i*41+17)%92;
      const size=2+(i%4)*.9;
      spark.style.cssText=`--left:${x}%;--top:${y}%;--size:${size}px;--duration:${5.5+(i%7)*1.35}s;--delay:-${(i*1.17)%11}s;--drift:${-24+(i*13)%50}px;--opacity:${(.4+(i%4)*.13).toFixed(2)}`;
      holder.appendChild(spark);
    }
    for(let i=0;i<5;i++){
      const flame=document.createElement('i');flame.className='pr27-fire-glow';
      flame.style.cssText=`--left:${5+i*22}%;--top:${18+(i*19)%74}%;--width:${80+i*12}px;--height:${110+i*14}px;--duration:${3.2+i*.65}s;--delay:-${i*1.4}s`;
      holder.appendChild(flame);
    }
    const ambience=scene.querySelector('.tournament-ambient');
    if(ambience)ambience.insertAdjacentElement('afterend',holder);else scene.prepend(holder);
    window.__PassRoyale27={version:'2.7',removedPoll:true,ambientParticles:31,flameGlows:5};
    return true;
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{if(setup())return;const observer=new MutationObserver(()=>{if(setup())observer.disconnect()});observer.observe(document.body,{childList:true,subtree:true});},{once:true});else if(!setup()){const observer=new MutationObserver(()=>{if(setup())observer.disconnect()});observer.observe(document.body,{childList:true,subtree:true});}
})();

</script>
